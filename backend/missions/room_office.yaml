mission_id: room_office
mission_title: "Ufficio Operativo (1F): Rete Access & Gateway"
description: "Rete dell'ufficio principale con switch access SW-OFFICE-01, router gateway RTR-GW-01 e postazioni PC-ROSARIA e PC-MARCO."
osi_layer: "Layer 2/3"

nodes:
  - label: SW-OFFICE-01
    role: switch
    cml_def: ioll2-xe
    x: -100
    y: 0
    faulty_config:
      - "hostname SW-OFFICE-01"
      - "vlan 10"
      - " name OFFICE_USERS"
      - "vlan 99"
      - " name MGMT"
      - "interface Ethernet0/0"
      - " switchport trunk encapsulation dot1q"
      - " switchport mode trunk"
      - " no shutdown"
      - "interface Ethernet0/1"
      - " switchport mode access"
      - " switchport access vlan 10"
      - " no shutdown"
      - "interface Ethernet0/2"
      - " switchport mode access"
      - " switchport access vlan 99"
      - " no shutdown"

  - label: RTR-GW-01
    role: router
    cml_def: iol-xe
    x: 160
    y: 0
    faulty_config:
      - "hostname RTR-GW-01"
      - "interface Ethernet0/0"
      - " no shutdown"
      - "interface Ethernet0/0.10"
      - " encapsulation dot1Q 10"
      - " ip address 192.168.10.1 255.255.255.0"
      - "interface Ethernet0/0.99"
      - " encapsulation dot1Q 99"
      - " ip address 192.168.99.1 255.255.255.0"

  - label: PC-ROSARIA
    role: host
    cml_def: alpine
    x: -200
    y: 160
    ip_config:
      ip: "192.168.10.10/24"
      gw: "192.168.10.1"

  - label: PC-MARCO
    role: host
    cml_def: alpine
    x: 0
    y: 160
    ip_config:
      ip: "192.168.99.10/24"
      gw: "192.168.99.1"

links:
  - src_node: SW-OFFICE-01
    dst_node: RTR-GW-01
  - src_node: SW-OFFICE-01
    dst_node: PC-ROSARIA
  - src_node: SW-OFFICE-01
    dst_node: PC-MARCO
