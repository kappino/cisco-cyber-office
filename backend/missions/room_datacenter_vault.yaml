mission_id: room_datacenter_vault
mission_title: "Datacenter Vault (-1F): Core Switching, SAN & Wireshark Probe"
description: "Infrastruttura critica del Piano -1: switch datacenter SW-DC-01, firewall/router FW-EDGE-01, storage SAN-NODE-01 e sonda Wireshark SOC-PROBE-01."
osi_layer: "Layer 2/3/7"

nodes:
  - label: SW-DC-01
    role: switch
    cml_def: ioll2-xe
    x: -100
    y: 0
    faulty_config:
      - "hostname SW-DC-01"
      - "vlan 50"
      - " name SAN_STORAGE"
      - "interface Ethernet0/0"
      - " switchport trunk encapsulation dot1q"
      - " switchport mode trunk"
      - " no shutdown"
      - "interface Ethernet0/1"
      - " switchport mode access"
      - " switchport access vlan 50"
      - " no shutdown"
      - "interface Ethernet0/2"
      - " switchport mode access"
      - " switchport access vlan 50"
      - " no shutdown"

  - label: FW-EDGE-01
    role: router
    cml_def: iol-xe
    x: 160
    y: 0
    faulty_config:
      - "hostname FW-EDGE-01"
      - "interface Ethernet0/0"
      - " no shutdown"
      - "interface Ethernet0/0.50"
      - " encapsulation dot1Q 50"
      - " ip address 10.50.0.1 255.255.255.0"

  - label: SAN-NODE-01
    role: host
    cml_def: alpine
    x: -200
    y: 160
    ip_config:
      ip: "10.50.0.10/24"
      gw: "10.50.0.1"

  - label: SOC-PROBE-01
    role: host
    cml_def: alpine
    x: 0
    y: 160
    ip_config:
      ip: "10.50.0.20/24"
      gw: "10.50.0.1"

links:
  - src_node: SW-DC-01
    dst_node: FW-EDGE-01
  - src_node: SW-DC-01
    dst_node: SAN-NODE-01
  - src_node: SW-DC-01
    dst_node: SOC-PROBE-01
